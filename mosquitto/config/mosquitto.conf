# Mosquitto para el Fleet Manager (VDA 5050).
#
# Replica el broker de desarrollo del README: localhost:1883 sin auth.
# Dentro de compose el FM lo alcanza como `mosquitto:1883` (ver
# docker-compose.yml: MQTT_HOST=mosquitto pisa el .env); desde el host
# sigue siendo localhost:1883 porque el puerto se publica.
#
# La persistencia es necesaria para los mensajes retained (`connection`
# con Last Will, `factsheet`): sin ella se pierden al reiniciar el broker.

listener 1883
protocol mqtt
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
