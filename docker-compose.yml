# Fleet Manager + Mosquitto en compose.
#
# Por qué hace falta el broker: el FM publica `state`/`connection`/
# `factsheet`/`order_response` por MQTT y recibe `order`/`instantActions`
# por MQTT (fm/mqtt_bus.py). Sin broker `MqttBus.start()` falla con
# TimeoutError y el FM no arranca. La web también lo necesita: lo que la UI
# envía lo publica en el broker y el FM lo lee por su suscripción normal.
#
# Servicios:
#   mosquitto  broker local sin auth (como el de desarrollo del README).
#              Puerto publicado para que scripts/mosquitto_sub/Node-RED del
#              host sigan usando localhost:1883.
#   fleet      FM contra robots reales (config/fleet.yaml + catalog/, fuera de git).
#              Necesita .env con el token (AUTH_HEADER/MIR_AUTH) y llegar por
#              red a las IPs de los MiR.
#   fleet-sim  FM simulado sin hardware (config/fleet-sim.yaml). Solo con
#              perfil `sim`: no arranca con `up` a secas.
#   voz        Pasarela de voz (clientes/voz): navegador → whisper → order al
#              FM por REST, como cualquier otro cliente. Solo con perfil `voz`.
#              Whisper no va aquí: se sirve desde el repo `inferencia` (host
#              :8080); `voz-whisper-check` espera a que responda.
#
# Uso:
#   docker compose up --build                    # mosquitto + robots reales + web :8050
#   docker compose --profile sim up --build fleet-sim   # demo sin robots, web :8051
#   docker compose --profile sim --profile voz up --build fleet-sim voz   # demo + voz :8000
#   docker compose run --rm fleet python run_fm.py --robot mir-1  # un solo robot
#   mosquitto_sub -t 'vda5050/#' -v              # ver el tráfico desde el host
#
# Nota WSL2 (ver CLAUDE.md): la web se alcanza desde otros equipos en
# http://<IP-Windows>:8050/ si WSL está en modo mirrored; si es NAT, con
# portproxy + regla de firewall.

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: fm-mosquitto
    ports:
      - "1883:1883"   # scripts del host, mosquitto_sub y Node-RED usan localhost:1883
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data   # retained: connection + factsheet
    restart: unless-stopped
    healthcheck:
      # El cliente mosquitto_pub viene en la propia imagen.
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-p", "1883", "-t", "fm/health", "-m", "ping", "-q", "0"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  fleet:
    build:
      context: .
      dockerfile: Dockerfile.fm
    container_name: fm-fleet
    # load_dotenv() no pisa variables ya definidas (fm/config.py), así que
    # MQTT_HOST=mosquitto gana al MQTT_HOST=localhost del .env dentro de compose.
    env_file:
      - .env   # token de los MiR (AUTH_HEADER/MIR_AUTH...), fuera de git
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
    # Usuario del host: el Configurador escribe config/fleet.yaml (y su .bak) y
    # Crear escribe en catalog/; con el usuario `fm` de la imagen no podría.
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8050:8050"   # interfaz web
    volumes:
      # Datos de la instalación (decisión 135): fuera de git y fuera de la imagen.
      # Si viven en otro sitio (FM_CONFIG/FM_CATALOG), monta esa carpeta aquí.
      - ./config:/app/config
      - ./catalog:/app/catalog
      # Cola de fleet/order en SQLite (decisión 160): fuera de la imagen para
      # que sobreviva a recrear el contenedor. `data/` ya existe en el repo
      # (si no, docker la crearía de root y el FM no podría escribir).
      - ./data:/app/data
    command: ["python", "run_fm.py", "--config", "config/fleet.yaml", "--catalog", "catalog", "--data", "data"]
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    # SIGTERM → el FM publica `connection: OFFLINE` y cierra limpio (run_fm.py).
    stop_grace_period: 15s

  fleet-sim:
    build:
      context: .
      dockerfile: Dockerfile.fm
    container_name: fm-fleet-sim
    profiles:
      - sim   # no arranca con `docker compose up` a secas
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8051:8050"   # distinto puerto para convivir con `fleet` si hace falta
    volumes:
      - ./config:/app/config
      - ./catalog:/app/catalog
      - ./data:/app/data   # fleet-sim.sqlite: no comparte cola con la flota real
    command: ["python", "run_fm.py", "--config", "config/fleet-sim.yaml", "--catalog", "catalog", "--data", "data"]
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s

  # Espera a que el whisper externo (repo inferencia, en el host) responda.
  voz-whisper-check:
    image: curlimages/curl:latest
    profiles:
      - voz
    environment:
      WHISPER_HEALTH_URL: ${WHISPER_HEALTH_URL:-http://host.docker.internal:8080/health}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Esperando a whisper en $$WHISPER_HEALTH_URL"
        for i in $$(seq 1 60); do
          if curl -fsS "$$WHISPER_HEALTH_URL" > /dev/null; then
            echo "whisper responde"; exit 0
          fi
          echo "intento $$i: aún no"; sleep 2
        done
        echo "whisper no responde"; exit 1

  voz:
    build: ./clientes/voz
    container_name: fm-voz
    profiles:
      - voz   # no arranca con `docker compose up` a secas
    env_file:
      - path: clientes/voz/.env   # opcional: sin él valen los valores por defecto de abajo
        required: false
    environment:
      # Dentro de compose el FM se alcanza por nombre de servicio (ganan a clientes/voz/.env).
      FM_URL: http://fleet:8050
      FM_SIM_URL: http://fleet-sim:8050
      WHISPER_URL: ${WHISPER_URL:-http://host.docker.internal:8080/inference}
      WHISPER_HEALTH_URL: ${WHISPER_HEALTH_URL:-http://host.docker.internal:8080/health}
    # Usuario del host: los archivos de clientes/voz/logs no quedan de root.
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${VOZ_PORT:-8000}:8000"   # el micro del navegador exige localhost o HTTPS
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./clientes/voz/missions.json:/app/missions.json:ro
      - ./clientes/voz/logs:/app/logs   # registro de voz: grabaciones, fuera de git
    depends_on:
      voz-whisper-check:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  mosquitto-data:
