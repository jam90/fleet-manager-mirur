# Fleet Manager + Mosquitto en compose.
#
# Por qué hace falta el broker: el FM publica `state`/`connection`/
# `factsheet`/`order_response` por MQTT y recibe `order`/`instantActions`
# por MQTT (fm/mqtt_bus.py). Sin broker `MqttBus.start()` falla con
# TimeoutError y el FM no arranca. La web también lo necesita: lo que la UI
# envía lo publica en el broker y el FM lo lee por su suscripción normal.
#
# Servicios:
#   mosquitto  broker local sin auth (como el de desarrollo del README).
#              Puerto publicado para que scripts/mosquitto_sub/Node-RED del
#              host sigan usando localhost:1883.
#   fleet      FM contra robots reales (config/fleet.yaml, 192.168.15.x).
#              Necesita .env con el token (AUTH_HEADER/MIR_AUTH) y llegar por
#              red a las IPs de los MiR.
#   fleet-sim  FM simulado sin hardware (config/fleet-sim.yaml). Solo con
#              perfil `sim`: no arranca con `up` a secas.
#
# Uso:
#   docker compose up --build                    # mosquitto + robots reales + web :8050
#   docker compose --profile sim up --build fleet-sim   # demo sin robots, web :8051
#   docker compose run --rm fleet python run_fm.py --robot mir-1  # un solo robot
#   mosquitto_sub -t 'vda5050/#' -v              # ver el tráfico desde el host
#
# Nota WSL2 (ver CLAUDE.md): la web se alcanza desde otros equipos en
# http://<IP-Windows>:8050/ si WSL está en modo mirrored; si es NAT, con
# portproxy + regla de firewall.

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: fm-mosquitto
    ports:
      - "1883:1883"   # scripts del host, mosquitto_sub y Node-RED usan localhost:1883
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data   # retained: connection + factsheet
    restart: unless-stopped
    healthcheck:
      # El cliente mosquitto_pub viene en la propia imagen.
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-p", "1883", "-t", "fm/health", "-m", "ping", "-q", "0"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  fleet:
    build:
      context: .
      dockerfile: Dockerfile.fm
    container_name: fm-fleet
    # load_dotenv() no pisa variables ya definidas (fm/config.py), así que
    # MQTT_HOST=mosquitto gana al MQTT_HOST=localhost del .env dentro de compose.
    env_file:
      - .env   # token de los MiR (AUTH_HEADER/MIR_AUTH...), fuera de git
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
    ports:
      - "8050:8050"   # interfaz web
    volumes:
      # La config se edita en el host sin reconstruir (nombres de missions,
      # positions, umbrales de batería). Solo lectura: el FM no la escribe.
      - ./config:/app/config:ro
    command: ["python", "run_fm.py", "--config", "config/fleet.yaml"]
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    # SIGTERM → el FM publica `connection: OFFLINE` y cierra limpio (run_fm.py).
    stop_grace_period: 15s

  fleet-sim:
    build:
      context: .
      dockerfile: Dockerfile.fm
    container_name: fm-fleet-sim
    profiles:
      - sim   # no arranca con `docker compose up` a secas
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
    ports:
      - "8051:8050"   # distinto puerto para convivir con `fleet` si hace falta
    volumes:
      - ./config:/app/config:ro
    command: ["python", "run_fm.py", "--config", "config/fleet-sim.yaml"]
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  mosquitto-data:
