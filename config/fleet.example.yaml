# Configuración de la flota: ejemplo para empezar.
#
# Cópialo como `config/fleet.yaml` (fuera de git) o a la carpeta de datos de
# tu instalación, junto a su `catalog/`, y di en `.env` dónde está
# (`FM_CONFIG`, `FM_CATALOG`; ver `.env.example`). Los nombres de missions y
# positions de abajo son inventados: pon los de la web de tus MiR.
#
# El core del FM solo lee las claves genéricas: `driver`, `manufacturer`,
# `battery_min` y la lista `actions` de cada robot, más `auto_charge`,
# `assigner`, `mqtt`, `site` (el site de la flota, que se elige en la
# cabecera de la web) y los nombres del catálogo `actions:`. Cada definición
# del catálogo la interpreta el driver del robot que la habilita. El resto
# del bloque de cada robot lo interpreta su driver
# (`fm/adapters/<driver>/config.py`), fusionado con `drivers.<driver>`.

mqtt:
  # Cada robot publica bajo el manufacturer de su driver (MiR → vda5050/v3/MiR/<serial>/…).
  # `fleet` no es un robot: sus topics fleet/order y fleet/order_response van
  # bajo este nombre de flota (vda5050/v3/imperial_fleet/fleet/…).
  fleet_manufacturer: imperial_fleet
  # host/port vienen de .env (MQTT_HOST, MQTT_PORT)

auto_charge:
  battery_floor: 20            # % — por debajo se encola la carga
  priority: 10                 # mayor = entra más arriba en la cola del robot
  abort_cooldown_s: 60         # si la carga aborta, esperar antes de re-postear

assigner:
  prefer_not_charging: true    # si hay otro robot libre, no sacar al que carga

# Defaults por marca. Cualquier clave se puede sobreescribir en el robot.
drivers:
  mir:
    # Grupo de missions (web del MiR) del que se leen las missions: reduce
    # ruido y peticiones. Se resuelve a GUID por robot con GET /mission_groups.
    mission_group: "mi-grupo"
    # Mission de auto-carga (sin inputs): GUID del catálogo o nombre EXACTO en el grupo.
    # Que termine sola (cargar hasta un %), o el robot no saldrá nunca del dock.
    charge_mission: "Carga en estación"
    # Opcional. Si se omite, vale cualquier position que exista en el robot.
    # positions_allowlist:
    #   - Almacen
    #   - Montaje

# Vuelta a la espera (opcional): si un robot lleva `after_s` segundos parado,
# el FM le manda esta action del catálogo, una vez, para que no estorbe donde
# acabó. Una order que llegue mientras va, la cancela. Cada robot puede usar
# otra (`idle_return: {action: ..., params: {...}}`) o ninguna (`idle_return: false`).
# Se edita también desde el Configurador.
# idle_return:
#   action: ir_a
#   after_s: 30
#   params: { target_pos: Espera }

# Histéresis: battery_min (aceptar trabajo) > battery_floor (ir a cargar).
# Así un robot que acaba de salir del suelo no recibe trabajo y vuelve a caer.
#
# Catálogo de actions: cada actionType se define UNA vez para toda la flota
# y cada robot lista abajo las que tiene habilitadas.
#
# Las missions se nombran por su GUID del catálogo (catalog/missions/), el
# mismo en todos los robots sincronizados, o por su nombre exacto en la web
# del MiR. Las positions se nombran como en la web del MiR y el driver las
# resuelve a GUID por robot al arrancar.
actions:
  ir_a:                    # target_pos = nombre de una position
    mission: "Ir a posición"
    position_inputs: [target_pos]
  transporte:              # recoger n piezas y llevarlas a un puesto
    mission: "Transporte"
    position_inputs: [target_pos]
    positions_allowlist: [Almacen, Montaje, Calidad]   # solo estas en ESTA action
    number_inputs:
      n_piezas: { min: 1, max: 10, step: 1 }           # rango → deslizador en la UI

# Qué actions puede hacer cada robot: nombres del catálogo de arriba. El
# asignador solo le manda las que tiene en su lista.
robots:
  mir-1:
    driver: mir                # por defecto "mir"; el manufacturer lo pone el driver ("MiR")
    host: 192.168.1.11         # o MIR_HOST_MIR_1 en .env
    battery_min: 25
    actions: [ir_a, transporte]
  mir-2:
    driver: mir
    host: 192.168.1.12
    battery_min: 25
    actions: [ir_a]

# Un robot simulado puede convivir con los reales (útil en clase; ojo: el
# asignador lo tratará como uno más). Flota solo simulada: config/fleet-sim.yaml.
#  sim-1:
#    driver: sim
#    battery: 90
#    battery_min: 25
#    actions: [ir_a]
